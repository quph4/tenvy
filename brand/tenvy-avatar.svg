<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2A2C"/>
      <stop offset="1" stop-color="#0B0B0C"/>
    </linearGradient>
    <!-- Champagne with a soft metallic falloff. userSpaceOnUse: an
         objectBoundingBox gradient has no extent on the flat stand line
         and would leave it unpainted. -->
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="196" y1="212" x2="828" y2="852">
      <stop offset="0" stop-color="#F0DDB3"/>
      <stop offset="0.55" stop-color="#D4B47C"/>
      <stop offset="1" stop-color="#A9844A"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- The mark: a screen on a stand, with a bold T inside. -->
  <g transform="translate(512 512) scale(0.82) translate(-512 -512)">
  <rect x="196" y="212" width="632" height="500" rx="128" fill="none" stroke="url(#gold)" stroke-width="80"/>
  <path d="M372 372 H652 M512 372 V572" stroke="url(#gold)" stroke-width="88" stroke-linecap="round"/>
  <path d="M392 812 H632" stroke="url(#gold)" stroke-width="64" stroke-linecap="round"/>
  </g>
</svg>
