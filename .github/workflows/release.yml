# Builds a signed Windows installer when a version tag is pushed and
# uploads it, with the latest.json the in-app updater reads, as a DRAFT
# release in the public releases repo (quph4/tenvy-releases). Smoke-test
# the draft, then publish it to roll the update out.
#
# Required repository settings (see RELEASING.md):
#   secrets.TAURI_SIGNING_PRIVATE_KEY           contents of tenvy-updater.key
#   secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (may be empty)
#   secrets.RELEASES_TOKEN                      fine-grained token, Contents: read & write
#                                               on quph4/tenvy-releases
#   vars.MPV_URL / vars.MPV_SHA256              pinned mpv 7z build to bundle
name: release

on:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Tag matches package.json
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} != package.json v$v" }

      - name: Bundle mpv
        shell: pwsh
        run: ./scripts/fetch-mpv.ps1 -Url "${{ vars.MPV_URL }}" -Sha256 "${{ vars.MPV_SHA256 }}"

      - name: Build signed installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: Draft release in tenvy-releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: ./scripts/publish-release.ps1
